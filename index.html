<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boletim de Câmera</title>
<meta name="description" content="Boletim de câmera para o AC: projetos, kit, registro de takes e exportação para o Offload Report.">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Boletim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: ferramenta de uma mão — cabeçalho fixo com câmera/cartão, faixas de botões empilhadas, doca fixa (registrar + abas), folhas de baixo para cadastros. Escuro primeiro: uso no set. */
:root{
  --bg:#14161a; --surface:#1c1f24; --surface-2:#252930; --line:#31363e;
  --fg:#ecebe6; --muted:#949aa2;
  --accent:#f2a33a; --accent-ink:#1b1206; --accent-soft:rgba(242,163,58,.15);
  --good:#5bc58a; --bad:#ec6c5f; --warn:#e3c35a; --scrim:rgba(0,0,0,.6);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f2f1ed; --surface:#ffffff; --surface-2:#e8e6e0; --line:#d5d2ca;
    --fg:#1a1c1f; --muted:#5b616a;
    --accent:#b0640a; --accent-ink:#ffffff; --accent-soft:rgba(176,100,10,.12);
    --good:#1c8247; --bad:#bf3a2b; --warn:#8f720c; --scrim:rgba(0,0,0,.4);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f2f1ed; --surface:#ffffff; --surface-2:#e8e6e0; --line:#d5d2ca;
  --fg:#1a1c1f; --muted:#5b616a;
  --accent:#b0640a; --accent-ink:#ffffff; --accent-soft:rgba(176,100,10,.12);
  --good:#1c8247; --bad:#bf3a2b; --warn:#8f720c; --scrim:rgba(0,0,0,.4);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{
  margin:0;background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
}
body.home{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}

/* Cabeçalho */
.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;gap:8px;padding-block:10px;flex-wrap:wrap}
.menu{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.units{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.unit{
  font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em;flex:none;
  min-width:44px;height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
}
.unit[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.reel{font-family:var(--f-mono);font-weight:600;font-size:18px;letter-spacing:.02em;margin-left:auto;font-variant-numeric:tabular-nums;text-align:right}
.reel small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:0}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);width:100%;margin-top:-2px;min-width:0}
.sync span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}

/* Blocos */
main{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-h{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.lbl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.val{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;min-width:0;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--muted)}
.sub{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
p{margin:0}

.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-12px;padding-inline:12px;scroll-padding-inline:12px;padding-bottom:2px}
.strip::-webkit-scrollbar,.units::-webkit-scrollbar{display:none}
.wrapchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  flex:none;min-width:52px;height:46px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--f-mono);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;
}
.chip small{font-family:var(--f-body);font-weight:500;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.8}
.chip.txt{font-family:var(--f-body);font-size:14px;font-weight:600}
.chip.lens{min-width:64px;height:54px}
.chip.lens b{font-size:18px}
.chip.base{position:relative}
.chip.base::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.chip.edit{height:40px;font-size:15px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:6px 12px;font-family:var(--f-mono);font-weight:600;font-size:14px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.mini input{width:96px}

input[type=text],input[type=number],input[type=date],input[type=time],select{
  height:44px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;min-width:0;width:100%;font-size:16px
}
input.mono{font-family:var(--f-mono);font-weight:600}

/* Claquete */
.slate{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.slate label{display:flex;flex-direction:column;gap:4px;min-width:0}
.slate label span,.fld>span{font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.slate input{font-family:var(--f-mono);font-weight:600;font-size:20px;text-align:center;height:50px}
.step{display:flex;align-items:stretch;height:50px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2)}
.step.sm{height:40px}
.step button{width:40px;border:0;background:transparent;font-size:22px;font-weight:600;flex:none}
.step output{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;padding:0 6px}
.step.sm output{font-size:17px}

/* Cartão / gravação */
.card-row{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.card-row .big{font-family:var(--f-mono);font-weight:600;font-size:20px}
.linkrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
.linkrow span{font-family:var(--f-mono);font-size:13.5px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.linkrow em{margin-left:auto;font-style:normal;color:var(--accent);font-weight:600;font-size:13px;flex:none}

/* Prévia da linha do boletim */
.preview{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.preview .lbl{font-size:12px}
.preview code{font-family:var(--f-mono);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.preview code.dim{color:var(--muted)}

.aval{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.aval .chip{width:100%;min-width:0;padding:0 4px;font-family:var(--f-body);font-size:14px}
.aval .chip[data-v="Boa"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.aval .chip[data-v="False Take"][aria-pressed="true"],.aval .chip[data-v="NV"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}

/* Doca */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.dock .wrap{display:flex;flex-direction:column;gap:8px;padding-top:10px}
.reg{
  height:56px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.05em;text-transform:uppercase;
}
.reg:active{transform:translateY(1px)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;height:46px;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:2px solid transparent}
.tabs button[aria-current="page"]{color:var(--fg);border-top-color:var(--accent)}

.btn{min-height:44px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.btn.full{width:100%}
.btn.add{border-style:dashed;color:var(--accent);background:transparent}

/* Boletim */
.group{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.group-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.group-h b{font-family:var(--f-mono);font-size:17px}
.group-h span{font-size:12.5px;color:var(--muted)}
.group-h .btn{margin-left:auto}
.take{border-bottom:1px solid var(--line)}
.take:last-child{border-bottom:0}
.take-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px}
.take-row .clip{font-family:var(--f-mono);font-weight:600;font-size:15px}
.take-row .sl{font-weight:600;font-size:14px}
.take-row .spec{grid-column:2/4;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cardlog{grid-column:1/-1;font-size:12px;color:var(--muted);padding:6px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.Boa{background:var(--good);border-color:var(--good);color:#fff}
.pill.OK{border-color:var(--good);color:var(--good)}
.pill.FT,.pill.NV{background:var(--bad);border-color:var(--bad);color:#fff}
.take-detail{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.take-detail dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.take-detail dt{color:var(--muted)}
.take-detail dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 label,.grid2 label,.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.empty{padding:24px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;letter-spacing:.04em}

/* Kit / listas */
.unitcard{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.unitcard input,.unitcard select{background:var(--surface)}
.unitcard .u{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.form .full{grid-column:1/-1}
.series{display:flex;flex-direction:column;gap:6px}
.series-h{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.series-h b{font-weight:600}
.series-h span{color:var(--muted);font-size:12px}
.series-h .btn{margin-left:auto}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.li .t small{display:block;color:var(--muted);font-size:12px}
.li.cur{box-shadow:inset 3px 0 0 var(--accent)}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:16px;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;font-family:var(--f-mono)}
.tag button{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--warn);padding:4px 10px}
.clock{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clock .cell{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.clock .cell span{display:block;font-size:11.5px;color:var(--muted)}
.clock .cell b{font-family:var(--f-mono);font-size:18px}
.over{color:var(--bad);font-weight:600}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}

/* Projetos */
.proj{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.proj b{font-family:var(--f-display);font-size:22px;letter-spacing:.03em;font-weight:700}
.proj span{font-size:12.5px;color:var(--muted)}
.projrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:stretch}
.hero{padding:6px 0 4px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:34px;letter-spacing:.03em;margin:0;line-height:1}
.hero p{color:var(--muted);font-size:14px;margin-top:4px}

/* Folha de baixo (cadastros) */
.sheet{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;margin:0}
.sheet-h .x{margin-left:auto}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap}
.sheet-foot .btn{flex:1}

/* Avisos */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px 10px 14px;display:flex;gap:12px;align-items:center;
  max-width:calc(100% - 32px);font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:4px}
.modal{position:fixed;inset:0;z-index:25;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-in{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;max-height:85vh}
.modal textarea{width:100%;min-height:240px;flex:1;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (min-width:560px){ .aval{grid-template-columns:repeat(4,minmax(0,140px))} }
</style>
</head>
<body>

<header class="top"><div class="wrap top-in" id="topIn"></div></header>

<main class="wrap" id="view"></main>

<div class="dock" id="dock"><div class="wrap">
  <button type="button" class="reg" id="regBtn" data-act="register">Registrar</button>
  <nav class="tabs" aria-label="Seções">
    <button type="button" data-act="tab" data-v="take">Take</button>
    <button type="button" data-act="tab" data-v="kit">Kit</button>
    <button type="button" data-act="tab" data-v="boletim">Boletim</button>
    <button type="button" data-act="tab" data-v="projeto">Projeto</button>
  </nav>
</div></div>

<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button type="button" data-act="undo" id="toastUndo">Desfazer</button></div>
<div class="modal" id="modal" hidden><div class="modal-in">
  <div class="blk-h"><span class="lbl" id="modalTitle">Arquivo</span><button type="button" class="btn sm" data-act="closeModal" style="margin-left:auto">Fechar</button></div>
  <p class="hint">O download não está disponível aqui. Copie o texto e salve como arquivo com o nome acima.</p>
  <textarea id="modalText" readonly></textarea>
  <button type="button" class="btn pri" data-act="copyModal">Copiar texto</button>
</div></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>

const ISO_STD=[25,32,40,50,64,80,100,125,160,200,250,320,400,500,640,800,1000,1250,1600,2000,2500,3200,4000,5000,6400,8000,10000,12800,16000,20000,25600,32000,40000,51200,64000,80000,102400];

function migrateV1(old){

  const c=old.cfg, p=newProject(c.producao||"Projeto importado","");
  p.diarias=(c.diarias||[]).map(d=>({key:d.key,n:d.n,date:d.date,start:null,end:null}));
  p.diariaKey=c.diariaKey; p.days={};

  (c.unitOrder||[]).forEach(l=>{
    const ou=c.units[l]; if(!ou) return;
    const model=CATALOG.find(m=>m.catalogId===ou.camId)||CATALOG.find(m=>m.name==="ALEXA Mini LF");
    const u=newUnit(l,model); u.roll=ou.roll; u.clip=ou.clip; u.slate=clone(ou.slate); u.codec=ou.codec||u.codec;

}

const stopOf=L=>(L&&L.stop)||"T";

  if(c.shMode==="deg") return "≈ 1/"+Math.round(360*fps/c.shDeg)+" s a "+fpsLabel(fps)+" fps";

    filters,dist:meas?String(c.dist||"").trim():"",alt:meas?String(c.alt||"").trim():"",aval:c.aval,obs:(c.obs||"").trim(),ts:Date.now()};
}
const tIris=t=>t.iris||("T"+t.t);
const ajustes=t=>[tIris(t),t.sh,fpsLabel(t.fps)+"fps",t.isoLabel+t.iso,t.wb+"K",...(t.filters||[]),t.dist?`Dist${t.dist}m`:"",t.alt?`Alt${t.alt}m`:""].filter(Boolean).join(" ");

function clipLine(t){
  const tok=s=>String(s||"").replace(/\s+/g,"")||"-";
  let s=`C${pad3(t.clip)} Cena ${tok(t.cena)} Plano ${tok(t.plano)} Take ${parseInt(t.take,10)||1}`;
  if(t.aval) s+=` - ${t.aval}`;

function rollTxt(roll,takes){
  const lines=[`CARD #${roll}`]; let last="";
  takes.slice().sort((a,b)=>a.clip-b.clip||a.ts-b.ts).forEach(t=>{const ll=lensLine(t); if(ll!==last){lines.push(ll);last=ll} lines.push(clipLine(t))});

}

function installBlk(){

    :`<p class="hint">No Chrome: menu <b>⋮</b> → <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</p>`;
  return `<section class="blk"><div class="blk-h"><span class="lbl">Instalar no celular</span></div>${how}<span class="hint">Instalado, o app abre em tela cheia e funciona sem internet.</span></section>`;

function backupBlk(){

  return `<section class="blk"><div class="blk-h"><span class="lbl">Backup</span><span class="val">${store.lastBackup?esc(ago(store.lastBackup)):"nunca"}</span></div>

}
function backupNudge(){

}

function clockHTML(p,d){
  if(!d) return "";
  const end=d.end||null, run=d.start&&!end, span=d.start?((end||Date.now())-d.start):0, over=span>12*3600000;
  return `<div class="clock">
    <div class="cell"><span>Início</span><b>${d.start?esc(hhmm(d.start)):"—"}</b></div>
    <div class="cell"><span>Fim</span><b>${end?esc(hhmm(end)):"—"}</b></div></div>
    ${d.start?`<span class="hint">${run?"Em andamento":"Duração"}: <b>${dur(span)}</b>${over?` · <span class="over">passou de 12h (+${dur(span-12*3600000)})</span>`:""}</span>`:""}
    <div class="row2">
      ${!d.start?`<button type="button" class="btn pri" data-act="dayStart" data-k="${esc(d.key)}">Iniciar diária agora</button>`:""}
      ${d.start&&!end?`<button type="button" class="btn pri" data-act="dayEnd" data-k="${esc(d.key)}">Encerrar diária agora</button>`:""}
      <button type="button" class="btn" data-act="sheet" data-v="editDay" data-id="${esc(d.key)}">Editar diária</button>
    </div>`;
}
function sensorInfo(u){
  const s=u.sensor||{}, a=num(s.start), b=num(s.end), parts=[];
  if(s.start) parts.push(`Início ${s.start} h${s.startTs?` (anotado em ${new Date(s.startTs).toLocaleDateString("pt-BR")})`:""}`);
  if(s.end) parts.push(`Fim ${s.end} h${s.endTs?` (anotado em ${new Date(s.endTs).toLocaleDateString("pt-BR")})`:""}`);
  if(a>=0&&b>=a&&s.start&&s.end) parts.push(`${fmtNum(b-a)} h de uso no filme`);
  return parts.join(" · ");
}

function viewBoletim(){

  const groups=[], idx={};
  d.takes.forEach(t=>{const g=t.unit+"|"+t.roll; if(!(g in idx)){idx[g]=groups.length;groups.push({unit:t.unit,roll:t.roll,cam:t.cam,takes:[]})} groups[idx[g]].takes.push(t)});
  const cardsOf=(un,roll)=>(d.cards||[]).filter(c=>c.unit===un&&c.roll===roll);
  const body=groups.length?groups.map(g=>{
    const cin=cardsOf(g.unit,g.roll)[0];
    return `<div class="group">
      <div class="group-h"><b>${esc(g.roll)}</b><span>CAM ${esc(g.unit)} · ${esc(g.cam)} · ${g.takes.length} ${g.takes.length===1?"clipe":"clipes"}</span>
        <button type="button" class="btn sm" data-act="exportTxt" data-k="${esc(key)}" data-v="${esc(g.unit+"|"+g.roll)}">Baixar ${esc(g.roll)}.txt</button></div>
      ${cin?`<div class="cardlog">Cartão ${esc(g.roll)} entrou às ${esc(hhmm(cin.ts))}</div>`:""}
      ${g.takes.slice().sort((a,b)=>a.clip-b.clip||a.ts-b.ts).map(t=>takeRow(t,key)).join("")}
    </div>`}).join(""):`<div class="empty"><b>Nenhum take nesta diária</b>Registre o primeiro na aba Take.</div>`;
  return `

}
function takeRow(t,key){
  const open=openTake===t.id;
  const spec=[t.lens,tIris(t),t.sh,fpsLabel(t.fps)+"fps",t.isoLabel+t.iso,t.wb+"K",...(t.filters||[]),t.dist?`Dist ${t.dist}m`:"",t.alt?`Alt ${t.alt}m`:""].filter(Boolean).join(" · ");
  const delArmed=armed==="del:"+t.id;
  const pc=t.aval==="False Take"?"FT":t.aval;
  return `<div class="take">
    <button type="button" class="take-row" data-act="openTake" data-v="${esc(t.id)}" aria-expanded="${open}">
      <span class="clip">C${pad3(t.clip)}</span><span class="sl">Cena ${esc(t.cena||"-")} · Pl ${esc(t.plano||"-")} · Tk ${esc(t.take)}</span>
      ${t.aval?`<span class="pill ${esc(pc)}">${esc(t.aval)}</span>`:`<span class="pill">—</span>`}
      <span class="spec">${esc(spec)}${t.obs?" · "+esc(t.obs):""}</span>
    </button>
    ${open?`<div class="take-detail">
      <dl><dt>Câmera</dt><dd>${esc(t.cam)}</dd><dt>Gravação</dt><dd>${esc([t.codec,t.format].filter(Boolean).join(" · ")||"—")}</dd>
      <dt>Shutter</dt><dd>${esc(t.sh)} (${esc(t.shEq)})</dd><dt>Hora</dt><dd>${esc(hhmm(t.ts))}</dd></dl>
      <div class="grid4">
        <label>Clipe<input type="number" class="mono" inputmode="numeric" min="1" id="te-clip-${esc(t.id)}" data-bind="takeField" data-f="clip" data-id="${esc(t.id)}" data-k="${esc(key)}" value="${esc(t.clip)}"></label>
        <label>Cena<input type="text" class="mono" id="te-cena-${esc(t.id)}" data-bind="takeField" data-f="cena" data-id="${esc(t.id)}" data-k="${esc(key)}" value="${esc(t.cena)}"></label>
        <label>Plano<input type="text" class="mono" id="te-plano-${esc(t.id)}" data-bind="takeField" data-f="plano" data-id="${esc(t.id)}" data-k="${esc(key)}" value="${esc(t.plano)}"></label>
        <label>Take<input type="number" class="mono" inputmode="numeric" min="1" id="te-take-${esc(t.id)}" data-bind="takeField" data-f="take" data-id="${esc(t.id)}" data-k="${esc(key)}" value="${esc(t.take)}"></label>
      </div>
      <div class="aval">${AVAL.map(a=>`<button type="button" class="chip txt" data-act="takeAval" data-k="${esc(key)}" data-id="${esc(t.id)}" data-v="${esc(a)}" aria-pressed="${t.aval===a}">${esc(a)}</button>`).join("")}</div>
      <input type="text" id="te-obs-${esc(t.id)}" data-bind="takeField" data-f="obs" data-id="${esc(t.id)}" data-k="${esc(key)}" value="${esc(t.obs)}" placeholder="Obs." autocomplete="off">
      <div class="row2"><button type="button" class="btn sm danger ${delArmed?"armed":""}" data-act="takeDel" data-k="${esc(key)}" data-v="${esc(t.id)}">${delArmed?"Toque de novo para excluir":"Excluir take"}</button></div>
    </div>`:""}
  </div>`;
}

  const opt=TEAM_OPT.map(([k,l])=>tm[k]!==null&&tm[k]!==undefined?`<div class="row2" style="align-items:end">${field(k,l).replace('class="fld"','class="fld" style="flex:1"')}<button type="button" class="x" data-act="teamOpt" data-v="${k}" aria-label="Tirar ${esc(l)}">×</button></div>`:"").join("");
  const extras=(tm.extras||[]).map(x=>`<div class="row2" style="align-items:end">
      <label class="fld" style="flex:1"><span>Função</span><input type="text" id="tx-r-${esc(x.id)}" data-bind="extra" data-f="role" data-id="${esc(x.id)}" value="${esc(x.role)}" placeholder="ex.: Steadicam"></label>
      <label class="fld" style="flex:1.4"><span>Nome</span><input type="text" id="tx-n-${esc(x.id)}" data-bind="extra" data-f="name" data-id="${esc(x.id)}" value="${esc(x.name)}"></label>
      <button type="button" class="x" data-act="delExtra" data-v="${esc(x.id)}" aria-label="Tirar função">×</button></div>`).join("");
  const addOpt=TEAM_OPT.filter(([k])=>tm[k]===null||tm[k]===undefined).map(([k,l])=>`<button type="button" class="btn sm add" data-act="teamOpt" data-v="${k}">+ ${esc(l)}</button>`).join("");
  return `
  <section class="blk">
    <div class="blk-h"><span class="lbl">Metadados</span></div>
    <label class="fld"><span>Nome do projeto</span><input type="text" id="pj-name" data-bind="projName" value="${esc(p.name)}" autocomplete="off"></label>
    <label class="fld"><span>Produtora (opcional)</span><input type="text" id="pj-prod" data-bind="projProd" value="${esc(p.produtora)}" autocomplete="off"></label>
    <span class="hint">O nome do projeto entra na planilha e no resumo da diária.</span>
  </section>
  <section class="blk">
    <div class="blk-h"><span class="lbl">Equipe</span></div>

  </section>
  <section class="blk">
    <div class="blk-h"><span class="lbl">Projeto</span></div>
    <div class="row2"><button type="button" class="btn" data-act="home">Trocar de projeto</button>

  </section>`;
}

function parseFocais(s){
  const out=[], bad=[];
  String(s||"").split("/").map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    const z=tok.match(/^(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)$/);
    if(z){const a=num(z[1]),b=num(z[2]); if(a>0&&b>a) out.push({zoom:true,focalMin:a,focalMax:b}); else bad.push(tok); return}
    const f=num(tok.replace(/mm$/i,"")); if(f>0&&/^\d+([.,]\d+)?(mm)?$/i.test(tok)) out.push({zoom:false,focal:f}); else bad.push(tok);
  });
  return {out,bad};
}
function lensPreview(){
  const el=$("#lensPreview"); if(!el) return;
  const {out,bad}=parseFocais(($("#sh-focais")||{}).value), mi=num(($("#sh-maxiris")||{}).value), st=($("#sh-stop")||{}).value||"T";
  el.innerHTML=out.length?`Vai adicionar ${out.length} ${out.length===1?"lente":"lentes"}: <b>${esc(out.map(o=>o.zoom?`${fmtNum(o.focalMin)}-${fmtNum(o.focalMax)}`:fmtNum(o.focal)).join(" · "))}</b>${mi>0?` · ${esc(st+fmtNum(mi))}`:""}${bad.length?` <span class="over">Não entendi: ${esc(bad.join(", "))}</span>`:""}`:(bad.length?`<span class="over">Não entendi: ${esc(bad.join(", "))}</span>`:"");
}

async function offerFile(name,text){
  const type=name.endsWith(".csv")?"text/csv":name.endsWith(".json")?"application/json":"text/plain";
  const blob=new Blob([text],{type});
  let touch=false; try{touch=matchMedia("(pointer:coarse)").matches}catch(e){}
  if(touch&&navigator.canShare&&typeof File==="function"){
    try{const file=new File([blob],name,{type}); if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return "shared"}}
    catch(e){if(e&&e.name==="AbortError")return "cancel"}
  }
  try{
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); toast(`${name} salvo em Downloads`); return "saved";
  }catch(e){$("#modalTitle").textContent=name; $("#modalText").value=text.replace(/^﻿/,""); $("#modal").hidden=false; return "shown"}
}

  switch(b){
    case "cena": u.slate.cena=v; updatePreview(); if(final)commit(); return;
    case "plano": u.slate.plano=v; updatePreview(); if(final)commit(); return;
    case "obs": u.cur.obs=v; updatePreview(); if(final)commit(); return;
    case "dist": case "alt": u.cur[b]=v.replace(",","."); updatePreview(); if(final)commit(); return;
    case "projName": if(final){const n=v.trim(); if(n){p.name=n; commit()} else {el.value=p.name; toast("O projeto precisa de um nome")}} return;
    case "projProd": if(final){p.produtora=v.trim(); commit()} return;
    case "team": if(final){p.team[el.dataset.f]=v.trim(); commit()} return;
    case "extra": if(final){const x=p.team.extras.find(x=>x.id===el.dataset.id); if(x){x[el.dataset.f]=v.trim(); commit()}} return;
    case "takeField": if(!final) return; {
      const d=p.days[el.dataset.k], t=d&&d.takes.find(x=>x.id===el.dataset.id), f=el.dataset.f; if(!t) return;
      if(f==="clip"||f==="take") t[f]=Math.max(1,parseInt(v,10)||1); else t[f]=v.trim();
      commit(); render();
    } return;
    case "viewDay": if(final){viewDay=v;openTake=null;render()} return;
    case "roll": if(final){const uu=p.units[el.dataset.u]; const r=v.trim().toUpperCase(); if(r&&r!==uu.roll){uu.roll=r; ensureDiaria(p); p.days[p.diariaKey].cards.push({unit:el.dataset.u,roll:r,ts:Date.now()})} commit(); render()} return;
    case "clip": if(final){const uu=p.units[el.dataset.u]; uu.clip=Math.max(1,parseInt(v,10)||1); commit(); render()} return;
    case "codec": case "format": if(final){p.units[el.dataset.u][b]=v; commit()} return;
    case "ndInt": if(final){const n=num(v); if(n>0){u.cur.ndInt=Math.round(n*100)/100; commit(); render()}} return;
    case "sensor": if(final){const uu=p.units[el.dataset.u], f=el.dataset.f, s=v.trim().replace(",","."); uu.sensor[f]=s; uu.sensor[f+"Ts"]=s?Date.now():null; commit(); render()} return;
    case "focal": case "wb": case "shDeg": case "shFrac": case "iris": if(final){
      const n=num(v); if(!(n>0)) return;
      if(b==="focal"){const L=lensById(p,u.cur.lensId); if(!L||!L.zoom||n<L.focalMin||n>L.focalMax){toast("Fora da faixa da zoom");return}}
      u.cur[b]=(b==="shDeg"||b==="iris"||b==="focal")?Math.round(n*100)/100:Math.round(n); commit(); render();} return;
  }
}
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.bind) onBind(e.target,false);
  if(e.target.dataset&&e.target.dataset.live==="lenses") lensPreview();
});
document.addEventListener("change",e=>{
  if(e.target.dataset&&e.target.dataset.bind) onBind(e.target,true);
  if(e.target.dataset&&e.target.dataset.live==="lenses") lensPreview();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.matches("input[data-bind]")) e.target.blur();
  if(e.key==="Escape"&&sheet) closeSheet();
});
$("#restoreFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  try{
    const r=parseBackup(await f.text()), ps=Object.values(r.data.projects);
    const takes=ps.reduce((a,p)=>a+Object.values(p.days).reduce((b,d)=>b+((d&&d.takes)||[]).length,0),0);
    pendingRestore={data:r.data,exportedAt:r.exportedAt,projects:ps.length,takes,name:f.name}; view="home"; render(); window.scrollTo(0,0);
  }catch(err){toast("Esse arquivo não é um backup do Boletim de Câmera")}
});
setInterval(()=>{const p=P(); if(p&&(view==="kit"||view==="boletim")){const d=curDiaria(p); if(d&&d.start&&!d.end&&!sheet&&!document.activeElement.matches("input,select")) render()}},60000);

/* ===================== Início ===================== */
store=load();
if(store.activeId&&store.projects[store.activeId]) view=store.projects[store.activeId].unitOrder.length?"take":"kit";
render();
askPersist();
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const w=reg.installing; if(!w) return;
      w.addEventListener("statechange",()=>{if(w.state==="activated"&&hadController)toast("Nova versão do app pronta",true,"Atualizar","reload",20000)});
    });
  }).catch(()=>{});
}
</script>
